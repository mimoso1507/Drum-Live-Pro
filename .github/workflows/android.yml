name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/DrumMatch-Deluxe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DrumMatch-Deluxe-apk
          path: out/DrumMatch-Deluxe.apk
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Drum Match Deluxe (última versión)
          prerelease: true
          files: out/DrumMatch-Deluxe.apk
          body: APK de prueba generado automáticamente desde main. Instálalo en Android 8.0 o superior.
